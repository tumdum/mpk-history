[package]
name = "mpk-history"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.37", features = ["serde"] }
maud = { version = "0.27.0", features = ["axum"] }
parking_lot = "0.12.5"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "gzip", "http2", "query"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
http-body-util = "0.1.5"
liblzma = { version = "0.4.8", features = ["static"] }
rstest = { version = "0.27.0", default-features = false }
serde_json = "1.0.151"
tempfile = "3.27.0"
thirtyfour = "0.37.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "full"

[build-dependencies]
built = { version = "0.8.1", features = ["git2"] }

[[bench]]
name = "backup"
harness = false
