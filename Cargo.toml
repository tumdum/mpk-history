[package]
name = "mpk-history"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "gzip", "http2", "query"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
liblzma = { version = "0.4.8", features = ["static"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
